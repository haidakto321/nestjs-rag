services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nestrag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: nestrag
    ports:
      - "5434:5432"
    volumes:
      - nestrag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d nestrag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nestrag-pgdata:
